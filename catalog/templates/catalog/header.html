<header>
    {% if user.is_authenticated %}
    <div class="pricing-header px-3 py-3 mx-auto text-center">
        <p class="lead">
            Добро пожаловать, {{user.username}}!
        </p>
    </div>
    {% else %}
    <div class="pricing-header px-3 py-3 mx-auto text-center">
        <p class="lead">
            Добро пожаловать на сайт!
        </p>
    </div>
    {% endif %}
</header>
