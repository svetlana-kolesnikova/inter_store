{% extends "catalog/base.html" %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}

<div class="container mt-4 text-center">
    <div class="card p-4 shadow-sm">
        <h3>Удалить продукт «{{ object.name }}»?</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mt-3">
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'catalog:products_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
