{% extends "catalog/base.html" %}

{% block title %}{% if form.instance.pk %}Редактирование{% else %}Новая запись{% endif %}{% endblock %}

{% block content %}

<div class="container mt-4">
    <h2 class="mb-4">{% if form.instance.pk %}Редактировать{% else %}Создать{% endif %} запись</h2>

    <form method="post" enctype="multipart/form-data" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

{% endblock %}
